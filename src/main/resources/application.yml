spring:
  application:
    name: cursos
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mi_base_datos}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Perfil Spring activo (leído de SPRING_PROFILES_ACTIVE env var)
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

aws:
  cognito:
    region: ${AWS_REGION:us-east-1}
    user-pool-id: ${AWS_COGNITO_USER_POOL_ID:us-east-1_xxxxxxxxx}
    client-id: ${AWS_COGNITO_CLIENT_ID:xxxxxxxxxxxxxxxxxxxxxxxxxx}
    client-secret: ${AWS_COGNITO_CLIENT_SECRET:}
  # Credenciales para APIs admin de Cognito (EC2 sin IAM role)
  access-key-id: ${AWS_ACCESS_KEY_ID:}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:}

# Configuración CORS
# Habilitar/deshabilitar CORS completamente (útil para deshabilitar cuando pasa por API Gateway)
app:
  cors:
    enabled: ${CORS_ENABLED:true}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    exposed-headers: ${CORS_EXPOSED_HEADERS:Authorization,Content-Type}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
    max-age: ${CORS_MAX_AGE:3600}

  # Configuración Notificaciones (ntfy)
  notification:
    base-url: ${NTFY_BASE_URL:https://ntfy.sh}
    topic-prefix: ${NTFY_TOPIC_PREFIX:app_vibe_}
    topic-hash-length: ${NTFY_TOPIC_HASH_LENGTH:20}
    connect-timeout: ${NTFY_CONNECT_TIMEOUT:10}
    read-timeout: ${NTFY_READ_TIMEOUT:30}