plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.duoc'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	runtimeOnly 'org.postgresql:postgresql'
	// AWS SDK v2 - Cognito Identity Provider
	implementation 'software.amazon.awssdk:cognitoidentityprovider:2.29.30'
	// Lombok para reducir boilerplate
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	// dotenv para cargar .env automáticamente
	implementation 'io.github.cdimascio:java-dotenv:5.2.2'
	// Testcontainers para tests de integración con PostgreSQL real
	testImplementation 'org.testcontainers:junit-jupiter:1.20.3'
	testImplementation 'org.testcontainers:postgresql:1.20.3'
	testImplementation 'org.testcontainers:localstack:1.20.3'  // Opcional: para Cognito real en tests
	// H2 para tests unitarios rápidos
	testRuntimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// Mockito para mocking de Cognito client
	testImplementation 'org.mockito:mockito-junit-jupiter:5.14.2'
}

tasks.named('test') {
	useJUnitPlatform()
}
